# research-forest configuration — copy to research-forest.toml (or pass --config PATH).
# Every setting is optional; the values below are the defaults.
# Secrets (API keys, the web token) do NOT go here: put them in .env (see .env.example)
# or export them in your shell. CLI flags override this file.

[llm]
backend = "openai"            # "openai" (any OpenAI-compatible API), "claude-code" or "codex"
# model = "gpt-6-luna"        # default: gpt-6-luna for openai and codex, haiku for claude-code
base_url = "https://api.openai.com/v1"   # e.g. "http://localhost:11434/v1" for Ollama
concurrency = 4               # parallel LLM calls
timeout = 300                 # seconds per call
retries = 2                   # retries after invalid output or transient errors
cache = true                  # cache responses in <db_path>.llmcache
effort = "low"                # claude-code/codex reasoning effort: low, medium, high, xhigh, max ("" = CLI default)
cli_user_config = false       # let claude/codex load your own setup (CLAUDE.md, hooks, plugins, config.toml)

[semantic_scholar]
requests_per_second = 1.0     # client-side rate limit

[pipeline]
target_papers = 60            # default graph size (`build -n` overrides)
max_candidates = 250          # upper bound on papers screened per screening step
max_refs_per_paper = 15       # in-graph references judged for builds-on per citing paper
baseline_papers = 8           # add up to N papers that graph papers compare against in their results (0 = off)
followup_papers = 6           # add up to N recent papers that cite key graph papers influentially (0 = off)
followup_seeds = 8            # key graph papers scanned for recent influential citations (one request each)
followup_years = 2            # how recent follow-ups must be (2 = this year and last)
update_papers = 10            # most papers one "check for new work" adds (half search, half follow-ups)

[fulltext]
enabled = true                # sandboxed download + BM25 gap filling
max_mb = 25                   # maximum decompressed download size
timeout = 90                  # seconds per document
memory_mb = 1024              # worker memory limit (POSIX)
allow_private = false         # disables the SSRF guard — local testing only
prefer_html = true            # try arXiv's HTML rendering before the PDF (cleaner text, readable tables)
always_fill_datasets = true   # search the full text for datasets for every paper (+1 small LLM call each);
single_pass = true            # with always_fill_datasets: read the full text first and extract in one LLM call
                              # false = only when fewer than 3 datasets were found
limitation_sections = true    # when the full text is read, also take limitations from its Limitations /
                              # Conclusion / Discussion sections

[server]
max_jobs = 2                  # concurrent build/refine jobs

[storage]
db_path = "research.forest.db"   # SQLite file holding all landscapes (`--db` overrides)

[logging]
llm_calls = true                 # record every LLM call: prompts, outputs, word counts, duration
llm_log_file = "research-forest-llm.jsonl"   # one JSON object per line; `research-forest llm-log` summarises it
