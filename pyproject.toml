[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-forest"
version = "0.1.0"
description = "Explore research landscapes as a searchable graph of papers, methods, datasets, limitations and open questions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pypdf>=4.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
research-forest = "research_forest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["research_forest"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM108", "SIM905", "E741", "B905"]  # ternaries aren't always clearer; `l` for links/lines is fine; zip() is used on equal lengths

[tool.ruff.lint.per-file-ignores]
"scripts/demo.py" = ["E501"]  # hand-written data tables
